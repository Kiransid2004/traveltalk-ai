services:
  # ── Backend: FastAPI ──────────────────────────────────────────
  - type: web
    name: traveltalk-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    plan: free

  # ── Frontend: Next.js ─────────────────────────────────────────
  - type: web
    name: traveltalk-ai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: BACKEND_URL
        value: https://traveltalk-ai-backend.onrender.com
    plan: free
